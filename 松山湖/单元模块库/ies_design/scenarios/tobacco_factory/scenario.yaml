  cold_storage:
    library_id: "cold_storage"
    enabled: true
    optimize_capacity: true
  steam_boiler:
    library_id: "steam_boiler"
    enabled: true
    optimize_capacity: true
  waste_heat_recovery:
    library_id: "waste_heat_recovery"
    enabled: true
    optimize_capacity: true
    capacity_ub_kw: 13937.4
optimization:
  mode: "test"
  methods: ["euclidean"]
